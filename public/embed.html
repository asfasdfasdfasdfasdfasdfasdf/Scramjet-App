<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scramjet Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }
        .nav-bar {
            background: #111;
            padding: 10px;
            display: flex;
            align-items: center;
        }
        .back-btn {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }
        .back-btn:hover { background: #cc0000; }
        .video-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a class="back-btn" href="/">⬅ Return to Home</a>
    </div>

    <div class="video-container" id="player-zone">
        <!-- The embed frame will inject here dynamically -->
    </div>

    <script>
        // Extract the raw video identity parameter from the browser window's query location
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const container = document.getElementById('player-zone');

        // Fixed regex validation to properly catch standard 11-character video IDs
        if (videoId && /^[a-zA-Z0-9_-]{11}\$/.test(videoId)) {
            // Build a clean official embed frame layout that forces unauthenticated streaming
            const iframe = document.createElement('iframe');
            iframe.src = `https://youtube.com{videoId}?autoplay=1&modestbranding=1&rel=0`;
            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
            iframe.allowFullscreen = true;
            container.appendChild(iframe);
        } else {
            container.innerHTML = `<div style="color: white; text-align: center; margin-top: 20%; font-size: 1.2rem;">Invalid or missing video signature.</div>`;
        }
    </script>
</body>
</html>
