<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Player</title>
    <style>
        /* Force a clean, borderless, fullscreen cinematic view */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>
    <iframe id="player" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>

    <script>
        // Read the extracted video parameter passed from the Service Worker routing hook
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        if (videoId) {
            // Apply YouTube's lightweight embed link framework directly
            document.getElementById('player').src = `https://youtube.com{videoId}?autoplay=1&rel=0`;
        } else {
            document.body.innerHTML = `
                <div style="color: #ff4d4d; font-family: sans-serif; text-align: center; margin-top: 20%;">
                    <h3>Error: No valid YouTube Video ID detected.</h3>
                </div>`;
        }
    </script>
</body>
</html>
